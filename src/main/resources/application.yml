global:
  temperature: 0.5
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: 'false'
  ai:
    mcp:
      client:
        toolcallback:
          enabled: true
        stdio:
          connections:
            gmail-sending:
              command: /Users/boliveira/.local/bin/uv
              args: run,--with,fastmcp,fastmcp,run,/Users/boliveira/fastmcp-experiments/fastmcp/test-servers/server.py
              env:
                GMAIL_APP_PASS: ${GMAIL_APP_PASS}
            brave-search:
              command: npx
              args: -y,@modelcontextprotocol/server-brave-search@0.6.2
              env:
                BRAVE_API_KEY: ${BRAVE_API_KEY}
        request-timeout: 30s
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: "qwen3:14b"
        temperature: 0.7
        max-tokens: 8192
